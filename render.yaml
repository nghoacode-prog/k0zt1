services:
  - type: web
    name: paw-dev-tx-ai-private-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SERVER_API_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
