services:
  - type: web
    name: pawnova-predict-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 30 --workers 2
    envVars:
      - key: PAW_TUNNEL_BASE
        value: http://180.93.102.202:5000
      - key: PAW_CACHE_TTL
        value: "28"
      - key: PAW_API_KEY
        value: ""
        
